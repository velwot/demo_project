<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple notes page." />
    <title>My Notes</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px; }
      main {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      }
      h1 { margin: 0; color: #2563eb; }
      form { margin-top: 28px; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      textarea {
        width: 100%; min-height: 130px; resize: vertical; padding: 12px;
        border: 1px solid #cbd5e1; border-radius: 8px; font: inherit;
      }
      textarea:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
      button {
        margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px;
        background: #2563eb; color: #ffffff; cursor: pointer; font: inherit; font-weight: 700;
      }
      button:hover { background: #1d4ed8; }
      #notes { display: grid; gap: 12px; margin: 28px 0 0; padding: 0; list-style: none; }
      .note { padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; }
      .note p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
      .note button { margin-top: 12px; background: #64748b; }
      .note button:hover { background: #475569; }
      #empty { margin: 28px 0 0; color: #64748b; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>My Notes</h1>

      <form id="note-form">
        <label for="note-input">Write a note</label>
        <textarea id="note-input" placeholder="Type something to remember..." required></textarea>
        <button type="submit">Save note</button>
      </form>

      <p id="empty">No notes yet. Add your first note above.</p>
      <ul id="notes"></ul>
    </main>

    <script>
      const storageKey = "my-notes";
      const form = document.querySelector("#note-form");
      const input = document.querySelector("#note-input");
      const notesList = document.querySelector("#notes");
      const emptyMessage = document.querySelector("#empty");
      let notes = JSON.parse(localStorage.getItem(storageKey) || "[]");

      function saveNotes() {
        localStorage.setItem(storageKey, JSON.stringify(notes));
      }

      function renderNotes() {
        notesList.innerHTML = "";
        emptyMessage.hidden = notes.length > 0;

        notes.forEach((note, index) => {
          const item = document.createElement("li");
          item.className = "note";

          const text = document.createElement("p");
          text.textContent = note;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Delete";
          remove.addEventListener("click", () => {
            notes.splice(index, 1);
            saveNotes();
            renderNotes();
          });

          item.append(text, remove);
          notesList.append(item);
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const note = input.value.trim();
        if (!note) return;

        notes.unshift(note);
        saveNotes();
        input.value = "";
        renderNotes();
        input.focus();
      });

      renderNotes();
    </script>
  </body>
</html>
